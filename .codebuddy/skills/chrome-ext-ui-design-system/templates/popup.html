<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thrilled</title>
    <!-- 样式接入顺序：fonts → base → tokens → 组件 → 主题（详见 references/css-integration.md） -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/themes/default.css" />
  </head>
  <body style="min-height: 0">
    <main class="container" style="padding: 16px; gap: 14px; align-items: stretch">
      <!-- 顶栏 -->
      <header class="header" style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700; color: var(--color-text)">Thrilled</span>
        <button class="ui-btn ui-btn-ghost ui-btn-icon ui-tip" type="button"
                title="更多" aria-label="更多" data-tooltip="更多操作">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
          </svg>
        </button>
      </header>

      <!-- 状态卡片 -->
      <section class="ui-section">
        <div class="ui-section-body" style="padding: 12px 14px">
          <div class="ui-form-row" style="padding: 4px 0">
            <div class="ui-form-left">
              <span class="ui-form-label">助手状态</span>
              <span class="ui-form-desc">服务连接与运行状态</span>
            </div>
            <div class="ui-form-right">
              <span class="ui-status-dot is-online" aria-label="在线"></span>
              <span style="font-size: 12px; color: var(--color-success)">运行中</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 单行文本（示例） -->
      <label class="ui-form-left" style="gap: 6px">
        <span class="ui-form-label">搜索内容</span>
        <input class="ui-input" type="text" placeholder="输入关键词…" />
      </label>

      <!-- 操作区 -->
      <div style="display: flex; gap: 8px">
        <button class="ui-btn ui-btn-primary" type="button" id="primary-action">主操作</button>
        <button class="ui-btn ui-btn-outline" type="button" id="secondary-action">次操作</button>
      </div>
    </main>

    <!-- Toast 容器 -->
    <div class="ui-toast-container" id="toastWrap"></div>

    <!-- 确认弹窗（默认 hidden） -->
    <div class="ui-overlay" id="confirmDlg" hidden>
      <div class="ui-dialog ui-dialog--confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="ui-dialog-icon is-danger" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6"/>
          </svg>
        </div>
        <h2 class="ui-dialog-title" id="confirm-title">确认操作？</h2>
        <div class="ui-dialog-body">该操作执行后不可撤销。</div>
        <div class="ui-dialog-footer">
          <button class="ui-btn ui-btn-outline ui-btn-sm" type="button" data-close>取消</button>
          <button class="ui-btn ui-btn-danger ui-btn-sm" type="button" id="confirm-ok">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/popup.js"></script>
  </body>
</html>
