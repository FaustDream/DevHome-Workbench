<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置 - Thrilled</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/themes/default.css" />
  </head>
  <body>
    <main class="page-shell">
      <!-- 顶栏 -->
      <header class="top-bar">
        <div class="top-bar-row">
          <div class="top-bar-brand">
            <span class="top-bar-title">Thrilled</span>
            <span class="top-bar-version">v1.0.0</span>
          </div>
          <div class="top-bar-actions">
            <button class="ui-btn ui-btn-outline ui-btn-sm" type="button">恢复默认</button>
            <button class="ui-btn ui-btn-primary ui-btn-sm" type="button">保存</button>
          </div>
        </div>
      </header>

      <div class="page-layout">
        <!-- 侧栏导航 -->
        <nav class="ui-sidenav" aria-label="设置导航">
          <button class="ui-sidenav-item is-active" data-nav-target="general" type="button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
            通用
          </button>
          <button class="ui-sidenav-item" data-nav-target="editor" type="button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3 21 8 8 21H3v-5Z"/></svg>
            编辑器
          </button>
        </nav>

        <div class="content-area">
          <!-- 通用设置 -->
          <section class="ui-section" data-panel="general">
            <div class="ui-section-head" role="button" tabindex="0" aria-expanded="true">
              <span class="ui-section-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
              </span>
              <h2 class="ui-section-title">通用设置</h2>
              <span class="ui-section-arrow" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </div>
            <div class="ui-section-body">
              <!-- 折叠栏 -->
              <div class="ui-collapse" data-collapse style="margin-bottom: 12px">
                <div class="ui-collapse-head" role="button" tabindex="0" aria-expanded="true">
                  <span class="ui-collapse-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6Z"/></svg></span>
                  <span class="ui-collapse-title">高级选项</span>
                  <span class="ui-collapse-arrow" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
                </div>
                <div class="ui-collapse-body">
                  <!-- 表单行：Toggle -->
                  <div class="ui-form-row">
                    <div class="ui-form-left">
                      <span class="ui-form-label">自动保存</span>
                      <span class="ui-form-desc">编辑后每 5 分钟自动保存</span>
                    </div>
                    <div class="ui-form-right">
                      <label class="ui-switch">
                        <input type="checkbox" checked />
                        <span class="ui-switch-track" aria-hidden="true"></span>
                      </label>
                    </div>
                  </div>
                  <!-- 表单行：下拉选择 -->
                  <div class="ui-form-row" style="align-items: flex-start; flex-direction: column; gap: 8px">
                    <div class="ui-form-left">
                      <span class="ui-form-label">默认字体大小</span>
                    </div>
                    <div class="ui-form-right" style="width: 100%">
                      <select class="ui-select">
                        <option>小 (12px)</option>
                        <option selected>标准 (14px)</option>
                        <option>大 (16px)</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 编辑器设置 -->
          <section class="ui-section" data-panel="editor" style="display: none">
            <div class="ui-section-head" role="button" tabindex="0" aria-expanded="true">
              <span class="ui-section-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3 21 8 8 21H3v-5Z"/></svg>
              </span>
              <h2 class="ui-section-title">编辑器设置</h2>
              <span class="ui-section-arrow" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </div>
            <div class="ui-section-body">
              <!-- 多行文本 -->
              <div class="ui-form-row" style="align-items: flex-start; flex-direction: column; gap: 8px">
                <div class="ui-form-left">
                  <span class="ui-form-label">默认模板</span>
                  <span class="ui-form-desc">新建笔记时的初始内容</span>
                </div>
                <textarea class="ui-textarea" rows="4" placeholder="输入默认模板…"></textarea>
              </div>
              <!-- 富文本示例 -->
              <div class="ui-richtext" style="margin-top: 12px">
                <div class="ui-richtext-toolbar" role="toolbar" aria-label="格式工具栏">
                  <button class="ui-richtext-btn" data-cmd="bold" type="button" title="加粗"><b>B</b></button>
                  <button class="ui-richtext-btn" data-cmd="italic" type="button" title="斜体"><i>I</i></button>
                  <span class="ui-richtext-sep" aria-hidden="true"></span>
                  <button class="ui-richtext-btn" data-cmd="insertUnorderedList" type="button" title="列表">•≡</button>
                  <button class="ui-richtext-btn" data-cmd="formatBlock" data-value="blockquote" type="button" title="引用">❝</button>
                </div>
                <div class="ui-richtext-body" contenteditable="true" role="textbox" aria-multiline="true"
                     data-placeholder="输入内容…"></div>
              </div>
              <!-- 时间选择 -->
              <div class="ui-form-row" style="align-items: flex-start; flex-direction: column; gap: 8px; margin-top: 4px">
                <div class="ui-form-left">
                  <span class="ui-form-label">每日提醒时间</span>
                </div>
                <div class="ui-form-right" style="width: 100%">
                  <div class="ui-time-quick">
                    <button class="ui-time-chip" type="button">09:00</button>
                    <button class="ui-time-chip is-active" type="button">12:00</button>
                    <button class="ui-time-chip" type="button">18:00</button>
                    <button class="ui-time-chip" type="button">21:00</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Toast 容器 -->
    <div class="ui-toast-container" id="toastWrap"></div>

    <script type="module" src="js/options.js"></script>
  </body>
</html>
