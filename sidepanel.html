<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHome Workbench - 侧边栏</title>
    <!-- 主题 Token：提供 --color-bg 等语义变量，使侧边栏响应浅色/深色切换 -->
    <link rel="stylesheet" href="css/themes/default.css">
    <link rel="stylesheet" href="css/sidepanel.css">
</head>
<body>
    <!-- iconfont Symbol Sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <symbol id="dh-icon-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1" fill="currentColor"/></symbol>
    </svg>
    <div class="sp-container">
        <!-- 头部 -->
        <header class="sp-header">
            <h1>工作台</h1>
            <span class="sp-version">v2.0</span>
        </header>

        <!-- 快速捕获 -->
        <section class="sp-section">
            <div class="sp-section-title">快速捕获</div>
            <input type="text" class="sp-capture-input" id="spCaptureInput"
                   placeholder="记录想法... 回车保存" autocomplete="off">
        </section>

        <!-- 最近捕获 -->
        <section class="sp-section">
            <div class="sp-section-title">最近捕获</div>
            <div class="sp-list" id="spCaptureList"></div>
        </section>

        <!-- 最近笔记 -->
        <section class="sp-section">
            <div class="sp-section-title">最近笔记</div>
            <div class="sp-list" id="spNotesList"></div>
        </section>

        <!-- 番茄钟状态条 -->
        <footer class="sp-pomodoro-bar" id="spPomodoroBar">
            <div class="sp-pomodoro-icon">🍅</div>
            <div class="sp-pomodoro-time" id="spPomodoroTime">--:--</div>
            <div class="sp-pomodoro-label" id="spPomodoroLabel">未开始</div>
            <button class="sp-pomodoro-toggle" id="spPomodoroToggle" title="暂停/继续">
                <svg class="dh-icon" width="14" height="14"><use href="#dh-icon-pause"></use></svg>
            </button>
        </footer>
    </div>

    <script src="js/secrets.js"></script>
    <script src="js/config.js"></script>
    <script src="js/storageV2.js"></script>
    <!-- 主题管理：在侧边栏内初始化 data-color-scheme，确保与主页面配色一致 -->
    <script src="js/theme-manager.js"></script>
    <script src="js/sidepanel.js"></script>
</body>
</html>
